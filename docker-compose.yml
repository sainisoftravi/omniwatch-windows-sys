services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=jhabsjajsdjashdj
      - MYSQL_DATABASE=oomnieye_construction
      - MYSQL_USER=oomnieye_construction
      - MYSQL_PASSWORD=jhabsjajsdjashdj
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pjhabsjajsdjashdj"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redpanda-init:
    image: busybox
    container_name: redpanda-init
    command: sh -c "chmod -R 777 /var/lib/redpanda/data"
    volumes:
      - ./data/redpanda:/var/lib/redpanda/data
    networks:
      - appnet

  redpanda:
    image: redpandadata/redpanda:latest-fips
    container_name: redpanda
    restart: unless-stopped
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory=1G
      - --reserve-memory=0M
      - --mode=dev-container
      - --kafka-addr 0.0.0.0:9092
      - --advertise-kafka-addr redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - ./data/redpanda:/var/lib/redpanda/data
    networks:
      - appnet

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=supersecretkey
      - QDRANT__STORAGE__WAL__ENABLED=true
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - appnet

  mediamtx-init:
    image: busybox
    container_name: mediamtx-init
    command: sh -c "mkdir -p /mnt/mediamtx-recordings /recordings && chmod -R 777 /mnt/mediamtx-recordings /recordings"
    volumes:
      - ./data/recordings:/mnt/mediamtx-recordings
      - ./data/recordings:/recordings
    networks:
      - appnet

  mediamtx:
    container_name: mediamtx-server
    image: bluenviron/mediamtx:1.14.0-ffmpeg
    restart: unless-stopped
    mem_limit: 4g
    depends_on:
      mediamtx-init:
        condition: service_completed_successfully
    environment:
      - MTX_LOGDESTINATIONS=file
      - MTX_LOGFILE=/logs/mediamtx.log
      - MTX_WRITEQUEUESIZE=4096
      - MTX_API=yes
      - MTX_APIADDRESS=:9997
      - MTX_RTSPTRANSPORTS=tcp
      - MTX_WEBRTCADDITIONALHOSTS=192.168.0.9
      - MTX_WEBRTCLOCALUDPADDRESS=:8189
      - MTX_WEBRTCALLOWORIGIN=*
      - MTX_HLSALLOWORIGIN=*
      - MTX_HLSVARIANT=mpegts
      - MTX_PATHDEFAULTS_RECORDPATH=/mnt/mediamtx-recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    ports:
      - "8554:8554"       # RTSP
      - "8889:8889"       # WebRTC/HLS Player
      - "1935:1935"       # RTMP
      - "8888:8888"       # Web API / Web UI
      - "8189:8189/udp"   # WebRTC UDP
      - "8890:8890/udp"   # WebRTC Extra UDP
      - "9997:9997"       # API
    volumes:
      - ./logs:/logs
      - ./mediamtx.yml:/mediamtx.yml
      - ./data/recordings:/mnt/mediamtx-recordings
      - ./data/recordings:/recordings
    networks:
      - appnet

  py:
    image: omniwatch-ai:latest
    container_name: omniwatch-ai
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_DRIVER=mysql+pymysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=oomnieye_construction
      - DB_USER=oomnieye_construction
      - DB_PASSWORD=jhabsjajsdjashdj
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=false
      - LOG_LEVEL=info
      - BASE_MODEL_DIR=./data/use_cases
      - DETECTIONS_STORAGE_PATH=./data/detections
      - TMP_DIR=./tmp/use_case_uploads
      - DETECTION_EVENT_SUPPRESSION_SECONDS=30
      - DETECTION_SAVE_IMAGES=True
      - CORS_ORIGINS=*
      - RECYCLE_BIN_RETENTION_DAYS=60
      - PURGE_CRON_HOUR=2
      - PURGE_CRON_MINUTE=0
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_DETECTION_TOPIC=events_json_prod
      - KAFKA_CONSUMER_GROUP=alert-rule-service_prod
      - KAFKA_NOTIFICATION_TOPIC=alert_notifications_prod
      - KAFKA_NOTIFICATION_CONSUMER_GROUP=notification-workers_prod
      - NOTIFICATION_MAX_RETRIES=2
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_HTTPS=false
      - QDRANT_API_KEY=supersecretkey
      - QDRANT_COLLECTION_NAME=face_embeddings
      - MAX_PARALLEL_USE_CASES=10
      - FACE_RECOGNITION_SCORE_THRESHOLD=0.2
      - FACE_RECOGNITION_MAX_FACES=20
      - FACE_RECOGNITION_MIN_DET_SCORE=0.5
      - FACE_RECOGNITION_MIN_BBOX_SIZE=45
      - FACE_RECOGNITION_MAX_ASPECT_RATIO=2.5
      - FACE_RECOGNITION_VALIDATE_LANDMARKS=true
      - FACE_RECOGNITION_UNKNOWN_MIN_DET_SCORE=0.5
      - INFERENCE_DEVICE=cpu
      - YOLO_CONFIG_DIR=/tmp
    shm_size: '2gb'
    ports:
      - "8009:8000"
    volumes:
      - ./data/py/data:/app/data
      - ./data/py/tmp/use_case_uploads:/app/tmp/use_case_uploads
      - ./data/py/tmp/detections:/app/tmp/detections
      - ./data/py/tmp/detection_videos:/app/tmp/detection_videos
    networks:
      - appnet

  alert:
    image: omniwatch-alert:latest
    container_name: omniwatch-alert
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_DRIVER=mysql+pymysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=oomnieye_construction
      - DB_PASSWORD=jhabsjajsdjashdj
      - DB_NAME=oomnieye_construction
      - DEBUG=true
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_DETECTION_TOPIC=events_json_prod
      - KAFKA_CONSUMER_GROUP=alert-rule-service_prod
      - KAFKA_NOTIFICATION_TOPIC=alert_notifications_prod
      - KAFKA_NOTIFICATION_CONSUMER_GROUP=notification-workers_prod
      - NOTIFICATION_MAX_RETRIES=2
      - TELEGRAM_BOT_TOKEN=7546300432:AAFdI-DlyZ8PCUf2hTUcGX8LGErw_LffGTA
      - TELEGRAM_WEBHOOK_URL=https://api.serviceworker.digitaleye.ai
      - TELEGRAM_WEBHOOK_ENABLED=true
      - AI_SERVER_PRODUCTION_URL=http://omniwatch-ai:8000
      - INFERENCE_DEVICE=cpu
    shm_size: '2gb'
    ports:
      - "8011:8000"
    volumes:
      - ./data/alert_venv:/app/venv
      - ./data/py/tmp/detections:/app/tmp/detections:ro
    networks:
      - appnet

  node:
    image: omniwatch-node:latest
    container_name: omniwatch-node
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - CORS_ORIGINS=*
      - LOG_LEVEL=info
      - APP_KEY=QayJT22J2qaBAu_8m4wOhXLNWt_NATUy
      - APP_URL=http://localhost:5003/
      - SESSION_DRIVER=cookie
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=oomnieye_construction
      - DB_PASSWORD=jhabsjajsdjashdj
      - DB_DATABASE=oomnieye_construction
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_DB=0
      - "REDIS_KEY_PREFIX=ai_server:"
      - PYTHON_API_URL=http://omniwatch-ai:8000/ai
      - MEDIAMTX_HOST=mediamtx
      - MEDIAMTX_API_PORT=9997
      - MEDIAMTX_HLS_PORT=8888
      - MEDIAMTX_WEBRTC_PORT=8889
      - PTZ_INVERT_TILT=true
      - PASSWORD_ENCRYPTION_KEY=your_secret_key_32chars
      - MEDIAMTX_RECORD_PART_DURATION=60s
      - MEDIAMTX_RECORD_SEGMENT_DURATION=60s
      - MEDIAMTX_RECORD_FORMAT=fmp4
      - MEDIAMTX_RECORDING_FILENAME_TIME=viewer_offset
      - MEDIAMTX_RECORDINGS_CATALOG=api
      - MEDIAMTX_MANUAL_RECORD_SEGMENT_DURATION=1h
      - MEDIAMTX_MANUAL_RECORD_PART_DURATION=1h
      - MEDIAMTX_RECORDINGS_ROOT=/mnt/mediamtx-recordings
      - LICENSE_SERVER_URL=https://dev.reseller-api.digitaleye.ai/api/v1
      - LICENSE_REQUEST_TIMEOUT=30000
      - LICENSE_ENFORCEMENT=true
      - LICENSE_PRODUCT_CODE=omniwatch
      - LICENSE_PRODUCT_VERSION=1.0.0
      - BOOTSTRAP_SUPERADMIN_EMAIL=sadmin@allcad.com
      - BOOTSTRAP_SUPERADMIN_PASSWORD=Admin@123
      - 'BOOTSTRAP_SUPERADMIN_FULL_NAME="Super Admin"'
    ports:
      - "5003:5000"
    volumes:
      - ./data/recordings:/mnt/mediamtx-recordings
      - ./data/node/data:/app/data
    networks:
      - appnet

  frontend:
    image: omniwatch-frontend:latest
    container_name: omniwatch-frontend
    restart: unless-stopped
    environment:
      REACT_APP_NODE_API_URL: http://localhost:5003
      REACT_APP_OMNI_WATCH_API_URL: http://localhost:5003
      REACT_APP_API_URL_LOGIN_AND_LOGOUT: http://localhost:5003
      REACT_APP_API_URL_LOGIN_AND_LOGOUT_DEV: http://localhost:5003
      REACT_APP_API_URL: http://localhost:8011
      REACT_APP_API_URL_FOR_AI_DETECTION: http://localhost:8009/ai
    ports:
      - "3002:80"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

